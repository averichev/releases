[package]
name = "veruna-releases"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
argon2 = "0.5"
getrandom = "0.3"
sha2 = "0.10"
futures-util = "0.3"
subtle = "2"
uuid = { version = "1", features = ["v4"] }
url = "2"
rpassword = "7"
zeroize = "1"
axum = { version = "0.8.9", features = ["multipart"] }
semver = "1"
cap-fs-ext = "3"
tokio-util = { version = "0.7", features = ["io"] }
cap-std = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
mime_guess = "2"
httpdate = "1"
rust-embed = { version = "8", features = ["debug-embed", "deterministic-timestamps"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "time", "sync", "io-util", "process"] }
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "set-header", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
semver = "1"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"
