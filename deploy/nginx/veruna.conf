# Include inside nginx's http {}. Replace certificate paths and the storage alias.
# Do not log $request or $request_uri: those contain user-controlled URLs/queries.
log_format veruna '$time_iso8601 $request_method $status $body_bytes_sent $request_time';
limit_conn_zone $binary_remote_addr zone=veruna_downloads:10m;
server {
    listen 443 ssl;
    server_name apps.veruna.systems;
    ssl_certificate /etc/letsencrypt/live/apps.veruna.systems/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apps.veruna.systems/privkey.pem;
    access_log /var/log/nginx/veruna-access.log veruna;
    # Stock nginx error logs can contain request URIs; disable them for this
    # server. Use Rust's sanitized boundary logs + access status for diagnosis.
    error_log /dev/null;
    client_max_body_size 2049m;
    sendfile on;
    gzip off;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host apps.veruna.systems;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
        # Never proxy_cache authorization, metadata, redirects or downloads.
        proxy_cache off;
    }
    location ~ "^/_veruna_files/([0-9a-f]{32}\.blob)$" {
        internal;
        alias /var/lib/veruna-releases/artifacts/$1;
        disable_symlinks on;
        open_file_cache off;
        # Rust and nginx both use mtime/length ETags for immutable objects.
        etag on;
        if_modified_since off;
        max_ranges 1;
        limit_conn veruna_downloads 16;
        # No public TTL: visibility may be revoked on the next request.
        # Cache-Control and Content-Disposition originate from Rust.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }
    location /_veruna_files/ { return 404; }
}
