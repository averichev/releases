# Relative paths are resolved against the process working directory.
[server]
bind = "127.0.0.1:8080"
# Automatic fallback only for loopback with automatic/matching origins.
# For a service behind nginx set auto_port = false.
auto_port = true
# Open the local panel after startup. Set false for headless installations.
open_browser = true
shutdown_timeout_seconds = 15

[database]
path = "data/veruna.sqlite"
max_connections = 4
busy_timeout_seconds = 5

[storage]
directory = "data/artifacts"
icons_directory = "data/icons"
# Must share the artifact filesystem; default follows storage.directory.
# temporary_directory = "data/artifacts/.tmp"
max_file_bytes = 2147483648
# Total batch size, including every platform and multipart overhead.
max_request_bytes = 2148532224
upload_idle_seconds = 120
max_concurrent_uploads = 4

[logging]
filter = "info,tower_http=info"

# Empty means automatic from the request domain and loopback proxy HTTPS.
# With Vite set public_origin = "http://127.0.0.1:5173" instead.
[auth]
public_origin = ""
session_ttl_seconds = 43200
invitation_ttl_seconds = 86400

# Empty means automatic, using the same domain as the current request.
# Set a fixed HTTPS origin only for a separate download domain.
[download]
public_base_url = ""
delivery_mode = "direct" # nginx requires deploy/nginx/veruna.conf
max_concurrent_downloads = 64

# Обновления самого Veruna Releases. Без секции проверка источника выключена.
# [self_update]
# manifest_url = "https://updates.example.org/releases/manifest.json"
# mode = "external" # только проверка; для установки на Linux: supervisor или standalone
# directory = "/var/lib/veruna-releases/updates" # отдельный приватный каталог для установки
