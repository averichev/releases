# Relative paths are resolved against the process working directory.
[server]
bind = "127.0.0.1:8080"
shutdown_timeout_seconds = 15

[database]
path = "data/veruna.sqlite"
max_connections = 4
busy_timeout_seconds = 5

[storage]
directory = "data/artifacts"

[logging]
filter = "info,tower_http=info"
